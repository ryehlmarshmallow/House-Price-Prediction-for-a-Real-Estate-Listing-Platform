name: continuous-integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
      - name: Sync environment
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src app scripts tests
      - name: Tests
        run: uv run pytest -q
