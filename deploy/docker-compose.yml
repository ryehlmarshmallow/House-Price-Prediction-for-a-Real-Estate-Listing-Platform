services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: ames-valuation-api:1.0.0
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: ames-valuation-app:1.0.0
    ports:
      - "8501:8501"
    environment:
      PORT: "8501"
      VALUATION_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
