[project]
name = "ames-valuation"
version = "1.0.0"
description = "End-to-end house price valuation platform for a real-estate listing business: synthetic context generation, cleaning, feature engineering, modelling, API, application and monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "faker>=40.54.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
    "tabulate>=0.10.0",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = true
